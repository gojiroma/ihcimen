<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Daily Notes</title>
  <meta name="app-version" content="42" />
  <link rel="icon" id="favicon" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Daily Notes" />
  <style>
    ::-webkit-scrollbar {
      display: none;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: "BIZ UDGothic", "Hiragino Kaku Gothic ProN", "Hiragino Sans",
        "Yu Gothic", Meiryo, sans-serif;
    }

    h1 {
      font-size: x-large;
      margin-top: 43px;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      box-sizing: border-box;
      padding-right: 160px;
      transition: padding-right 0.25s ease, padding-left 0.25s ease;
    }

    body.day-pane-collapsed .container {
      padding-right: 0;
    }

    body.day-pane-collapsed .day-pane {
      transform: translateX(100%);
      pointer-events: none;
    }

    /* ノブ(縁から出っ張るタブ)は廃止し、パネル自体または画面端の
       見えない領域をフリックして開閉する。閉じているときだけ、対応する
       端でポインタ操作を受け付ける(開いている間は中のセルのクリック等を
       邪魔しないようpointer-events:noneにしておく)。 */
    .edge-swipe-zone {
      position: fixed;
      z-index: 460;
      pointer-events: none;
      touch-action: none;
      /* PCでドラッグ操作すると、地の文字が選択状態になってしまう
         (マウスドラッグ = テキスト選択、というブラウザの既定動作と衝突する)
         ため、常に選択不可にしておく。 */
      user-select: none;
    }

    /* 各種フリック/ドラッグ操作中(suppressTextSelection〜
       restoreTextSelection)は、ページ全体で文字選択を止めておく。
       全画面カレンダーの出入りのようにドラッグ中にDOM構造ごと
       入れ替わる操作では、この見えない領域自身をuser-select:noneに
       するだけでは、入れ替わった後にカーソル下へ来た本文が選択されて
       しまうのを防げないため。 */
    body.gesture-drag-active {
      user-select: none;
    }

    #dayPaneOpenZone {
      top: 0;
      right: 0;
      bottom: 0;
      width: 80px;
    }

    /* 全画面カレンダー(z-index:500)の上に来るよう、全画面表示中は
       常に手前に出しておく(pointer-eventsはday-pane-collapsedの
       ときだけautoになるので、開いている間は素通りする)。閉じるタイミングで
       z-indexだけを動かすと、ドラッグ中にヒットテストが変わってしまうため
       常時適用にしている。 */
    body.schedule-bar-fullscreen #dayPaneOpenZone {
      z-index: 502;
    }

    body.day-pane-collapsed #dayPaneOpenZone {
      pointer-events: auto;
    }

    #scheduleBarFullscreenExitZone {
      top: 0;
      left: 0;
      /* 右のDay pane(160px)には重ねない。カレンダーグリッドの真上だけ */
      right: 160px;
      height: 24px;
      z-index: 504;
    }

    body.schedule-bar-fullscreen #scheduleBarFullscreenExitZone {
      pointer-events: auto;
    }

    /* 全画面カレンダー表示中は、主要な通常表示UIを隠す */
    body.schedule-bar-fullscreen .h1-shortcut-bar,
    body.schedule-bar-fullscreen .search-pane,
    body.schedule-bar-fullscreen #searchPaneOpenZone,
    body.schedule-bar-fullscreen .container {
      display: none;
    }

    body.schedule-bar-fullscreen .schedule-bar {
      display: flex;
      height: 100vh;
      transform: translateY(0);
      pointer-events: auto;
      /* 以前はセルを直接flex-wrapで折り返していたが、折り返し列数の
         JS側の想定(getFullscreenColumns)と実際のレイアウトがズレる
         (スクロールバーの出現/消失、フォント読み込みなど)たびに
         列がガクッとずれる「継ぎ目」バグの温床だった。今は1行=1つの
         .fs-row(JS側で列数を確定させてから作る)という明示的な構造に
         したので、折り返しをブラウザに委ねる必要がない。 */
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
      /* スクロールバーの出現/消失でclientWidthが変わると、新しく追加する
         行の列数(getFullscreenColumns)が既存の行とズレてしまうため、
         常に同じガター幅を確保しておく。 */
      scrollbar-gutter: stable;
      /* スクロール中にDOMを増減させて追従すると、慣性スクロールと
         競合してカクつく(「継ぎ目で引っかかる」)ことがあるため、
         行境界にゆるく吸着させて止まりやすくしておく
         (mandatoryだと逆に窮屈なのでproximityに留める)。 */
      scroll-snap-type: y proximity;
      z-index: 500;
      /* 背景を透過させ、下にある年の透かし表示を見せる */
      background-color: transparent;
    }

    /* 全画面カレンダーの1行。列数はJS側(getFullscreenColumns)で
       確定させてから作るので、中のセルは常にちょうどその数だけ並ぶ。 */
    .fs-row {
      display: flex;
      flex-direction: row;
      flex-shrink: 0;
      scroll-snap-align: start;
    }

    body.schedule-bar-fullscreen .schedule-bar .schedule-cell {
      height: 160px;
      width: auto;
      flex: 1 1 0;
    }

    .schedule-fullscreen-close {
      display: none;
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 502;
      width: 48px;
      height: 48px;
      box-sizing: border-box;
      border-radius: 50%;
      border: 1px solid #ccc;
      background-color: var(--bg-color);
      color: inherit;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    body.schedule-bar-fullscreen .schedule-fullscreen-close {
      display: flex;
      align-items: center;
      justify-content: center;
      right: 180px;
    }

    /* 全画面カレンダー: 今日の位置へスクロールし直すボタン
       (閉じるボタンの隣に並べる)。 */
    .schedule-fullscreen-today {
      display: none;
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 502;
      width: 48px;
      height: 48px;
      box-sizing: border-box;
      border-radius: 50%;
      border: 1px solid #ccc;
      background-color: var(--bg-color);
      color: inherit;
      font: inherit;
      font-size: 13px;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    body.schedule-bar-fullscreen .schedule-fullscreen-today {
      display: flex;
      align-items: center;
      justify-content: center;
      right: 240px;
    }

    /* 全画面カレンダー: 曜日・毎月同日での絞り込み */
    .schedule-fullscreen-filter {
      display: none;
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      left: 16px;
      /* 全画面終了用のフリック領域(#scheduleBarFullscreenExitZone、
         z-index:504)と上端で重なるため、それより手前に置いてクリックを
         奪われないようにする。 */
      z-index: 505;
      gap: 6px;
    }

    body.schedule-bar-fullscreen .schedule-fullscreen-filter {
      display: flex;
    }

    .schedule-fullscreen-filter select {
      font: inherit;
      font-size: 12px;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid rgba(128, 128, 128, 0.4);
      background-color: var(--bg-color);
      color: inherit;
      opacity: 0.75;
      cursor: pointer;
    }

    .schedule-fullscreen-filter select:hover,
    .schedule-fullscreen-filter select:focus {
      opacity: 1;
    }

    /* 全画面カレンダー中央の、うっすらとした大きな年の透かし表示。
       画面全体を覆う表示にしたいので、Day paneより手前(高いz-index)に
       置き、幅が狭い画面でもDay paneの裏に隠れないようにする。 */
    .fullscreen-year-watermark {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 503;
      font-size: clamp(120px, 30vw, 400px);
      font-weight: 700;
      color: var(--text-color);
      opacity: 0.06;
      pointer-events: none;
      user-select: none;
      white-space: nowrap;
      transition: opacity 0.3s ease;
    }

    body.schedule-bar-fullscreen .fullscreen-year-watermark {
      display: block;
    }

    /* 全画面カレンダーでない間、画面中央にうっすらと現在時刻を表示する */
    .idle-clock-watermark {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 503;
      font-size: clamp(80px, 20vw, 260px);
      font-weight: 700;
      color: var(--text-color);
      opacity: 0.06;
      pointer-events: none;
      user-select: none;
      white-space: nowrap;
    }

    body:not(.schedule-bar-fullscreen) .idle-clock-watermark {
      display: block;
    }

    /* セルの長押し/右クリックで開く色選択ポップアップ */
    .cell-color-picker {
      display: none;
      position: fixed;
      z-index: 1600;
      transform: translate(-50%, 8px);
      background-color: var(--bg-color);
      color: inherit;
      border: 1px solid rgba(128, 128, 128, 0.4);
      border-radius: 10px;
      padding: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      flex-wrap: wrap;
      gap: 6px;
      max-width: 180px;
    }

    .cell-color-picker.open {
      display: flex;
    }

    .cell-color-swatch {
      width: 28px;
      height: 28px;
      box-sizing: border-box;
      border-radius: 50%;
      border: 1px solid rgba(128, 128, 128, 0.3);
      cursor: pointer;
      padding: 0;
    }

    .cell-color-clear {
      flex-basis: 100%;
      font: inherit;
      font-size: 12px;
      padding: 5px 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: none;
      color: inherit;
      cursor: pointer;
    }

    /* 全画面カレンダー: 右端にDay pane(1日ずつのリスト)。
       Day pane自体は開いている間もフリックで閉じられ、閉じると
       カレンダー側がその分右へ広がる。 */
    body.schedule-bar-fullscreen .schedule-bar {
      left: 0;
      right: 160px;
    }

    body.schedule-bar-fullscreen.day-pane-collapsed .schedule-bar {
      right: 0;
    }

    body.schedule-bar-fullscreen .day-pane {
      z-index: 501;
    }

    body.schedule-bar-fullscreen .day-pane .schedule-cell.fullscreen-centered {
      box-shadow: inset 0 0 0 2px rgba(59, 130, 196, 0.6);
    }

    .content-area {
      flex: 1;
      width: 100%;
      min-width: 0;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 24px;
      box-sizing: border-box;
    }

    .date-display {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      margin-top: 20px;
      margin-bottom: 20px;
      cursor: pointer;
      touch-action: pan-y;
      opacity: 1;
      transition: opacity 0.15s ease;
      /* 長押し/ダブルクリック時にテキスト選択されてしまうのを防ぐ */
      user-select: none;
    }

    /* タッチデバイスで編集中は、周辺UIを隠して本文に集中できるようにする */
    body.touch-editing .schedule-bar,
    body.touch-editing .day-pane,
    body.touch-editing .search-pane,
    body.touch-editing .edge-swipe-zone,
    body.touch-editing .h1-shortcut-bar {
      display: none;
    }

    body.touch-editing .date-display {
      position: fixed;
      top: 10px;
      right: 10px;
      left: auto;
      margin: 0;
      z-index: 450;
    }

    body.touch-editing .content-area {
      padding-top: 50px;
    }

    .date-display:hover {
      opacity: 0.7;
    }

    .date-display .year {
      font-size: 24px;
      margin-right: 10px;
    }

    .date-display .month-day {
      font-size: 36px;
      margin-right: 10px;
    }

    .info-widget {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: -10px;
      margin-bottom: 16px;
      font-size: 12px;
      opacity: 0.65;
      cursor: pointer;
      user-select: none;
    }

    .info-widget:empty {
      display: none;
    }

    .info-widget:hover {
      opacity: 0.95;
    }

    .info-widget-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .info-widget-item.is-stale {
      opacity: 0.55;
    }

    .info-widget-item .info-widget-delta.up {
      color: #c0392b;
    }

    .info-widget-item .info-widget-delta.down {
      color: #2471a3;
    }

    body.touch-editing .info-widget {
      display: none;
    }

    .busy-day-panel {
      display: none;
      width: 700px;
      max-width: 100%;
      margin-bottom: 16px;
      border: 1px solid rgba(128, 128, 128, 0.3);
      border-radius: 8px;
      padding: 10px 12px;
      box-sizing: border-box;
      font-size: 13px;
      background-color: rgba(128, 128, 128, 0.06);
    }

    .busy-day-panel.is-open {
      display: block;
    }

    .busy-day-panel-header {
      font-weight: 700;
      margin-bottom: 6px;
    }

    .busy-day-panel-empty {
      opacity: 0.7;
    }

    .busy-day-panel-list {
      list-style: decimal;
      margin: 0;
      padding-left: 20px;
    }

    .busy-day-panel-item {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      padding: 4px 0;
      cursor: pointer;
      border-bottom: 1px solid rgba(128, 128, 128, 0.12);
    }

    .busy-day-panel-item:last-child {
      border-bottom: none;
    }

    .busy-day-panel-item:hover {
      opacity: 0.75;
    }

    .busy-day-panel-item.has-priority .busy-day-panel-label {
      font-weight: 700;
    }

    .busy-day-panel-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .busy-day-panel-budget {
      flex-shrink: 0;
      opacity: 0.6;
      font-size: 12px;
    }

    .busy-day-panel-footer {
      margin-top: 8px;
      font-size: 11px;
      opacity: 0.6;
    }

    body.touch-editing .busy-day-panel {
      display: none;
    }

    .date-display .weekday {
      font-size: 18px;
      line-height: 1.2;
    }

    .privacy-banner {
      width: 700px;
      max-width: 100%;
      margin-top: 10px;
      font-size: 12px;
      opacity: 0.7;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .privacy-banner button {
      font: inherit;
      font-size: 12px;
      background: none;
      border: none;
      color: inherit;
      text-decoration: underline;
      cursor: pointer;
      padding: 0;
    }

    /* 折り畳みはせず、常に全項目を一望できるようにする */
    .menu-drawer section {
      margin-top: 10px;
      padding: 6px 0;
      border-top: 1px solid rgba(128, 128, 128, 0.3);
    }

    .menu-drawer section>h3 {
      margin: 0;
      font-size: 1em;
      font-weight: 700;
      padding: 4px 0;
    }

    .menu-inline-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .storage-usage-panel {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.3);
    }

    .storage-usage-text {
      font-size: 12px;
      opacity: 0.75;
      margin: 0 0 6px;
      line-height: 1.5;
    }

    .storage-usage-bar {
      height: 6px;
      border-radius: 3px;
      background-color: rgba(128, 128, 128, 0.2);
      overflow: hidden;
    }

    .storage-usage-bar-fill {
      height: 100%;
      width: 0%;
      background-color: rgba(59, 130, 196, 0.7);
      transition: width 0.3s ease;
    }

    .ics-calendar-list {
      margin: 10px 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .ics-calendar-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ics-color-dot {
      flex-shrink: 0;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1px solid rgba(128, 128, 128, 0.3);
    }

    .ics-calendar-url {
      flex: 1;
      min-width: 0;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ics-remove-btn {
      flex-shrink: 0;
      font: inherit;
      font-size: 14px;
      line-height: 1;
      padding: 2px 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: none;
      color: inherit;
      cursor: pointer;
    }

    .ics-url-input {
      width: 100%;
      box-sizing: border-box;
      font: inherit;
      font-size: 13px;
      padding: 6px 8px;
      margin-top: 4px;
      border: 1px solid rgba(128, 128, 128, 0.4);
      border-radius: 6px;
      background-color: var(--bg-color);
      color: inherit;
    }

    .ics-color-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .ics-color-swatch {
      width: 22px;
      height: 22px;
      box-sizing: border-box;
      border-radius: 50%;
      border: 1px solid rgba(128, 128, 128, 0.3);
      cursor: pointer;
      padding: 0;
    }

    .ics-color-swatch.selected {
      box-shadow: 0 0 0 2px rgba(59, 130, 196, 0.8);
    }

    .menu-inline-btn {
      font: inherit;
      font-size: 13px;
      padding: 6px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: none;
      color: inherit;
      cursor: pointer;
    }

    .ics-publish-row {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.2);
    }

    .ics-publish-row:first-of-type {
      margin-top: 6px;
    }

    .ics-publish-label {
      display: block;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .ics-publish-url-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
    }

    .ics-publish-url-row[hidden] {
      display: none;
    }

    .ics-publish-url-input {
      flex: 1;
      min-width: 0;
      box-sizing: border-box;
      font: inherit;
      font-size: 12px;
      padding: 6px 8px;
      border: 1px solid rgba(128, 128, 128, 0.4);
      border-radius: 6px;
      background-color: var(--bg-color);
      color: inherit;
    }

    .ics-publish-status {
      margin-top: 4px;
    }

    .menu-danger-btn {
      color: #c0392b;
      border-color: #c0392b;
    }

    /* 同期パネル(メニュー内インライン) */
    .sync-panel {
      margin-top: 10px;
    }

    .sync-toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .sync-toggle {
      position: relative;
      flex-shrink: 0;
      width: 44px;
      height: 24px;
      box-sizing: border-box;
      border-radius: 12px;
      border: 1px solid #ccc;
      background: none;
      padding: 0;
      cursor: pointer;
    }

    .sync-toggle-knob {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background-color: currentColor;
      opacity: 0.5;
      transition: left 0.15s ease, opacity 0.15s ease;
    }

    .sync-toggle[aria-checked="true"] .sync-toggle-knob {
      left: 22px;
      opacity: 1;
    }

    .sync-note {
      font-size: 13px;
      opacity: 0.75;
      margin: 10px 0 0;
    }

    #syncStartChoice,
    #syncOnPanel,
    #syncContinuePanel {
      display: none;
    }

    #syncQrCanvas {
      max-width: 100%;
      margin-top: 10px;
    }

    .sync-seed-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      font-size: 13px;
    }

    #syncSeedText,
    #syncSeedInput {
      flex: 1;
      min-width: 120px;
      font: inherit;
      font-size: 13px;
      padding: 5px 8px;
      border: 1px solid rgba(128, 128, 128, 0.4);
      border-radius: 4px;
      background-color: var(--bg-color);
      color: inherit;
      box-sizing: border-box;
    }

    #syncContinuePanel p {
      font-size: 13px;
      opacity: 0.75;
      margin: 10px 0 6px;
    }

    #syncContinuePanel #syncSeedInput {
      width: 100%;
      margin-bottom: 8px;
    }

    .sync-handoff-code-display {
      display: none;

<body>
  <div id="root">
    <div style="text-align:center;margin-top:60px;font-size:14px;opacity:0.7;">
      アプリを読み込み中です...
    </div>
  </div>
  <!-- 初期化スクリプト: Service Worker登録とマニフェスト読み込み -->
  <script>
    (function () {
      // PWA installation を確実にするため、manifest.json を先に読み込む
      function ensureManifestLoaded() {
        if ("serviceWorker" in navigator) {
          // manifest.jsonをfetchして確実にロードしておく
          fetch("/manifest.json", { method: "HEAD" })
            .then(() => {
              // manifestが読み込めた後、Service Workerを登録
              navigator.serviceWorker
                .register("/sw.js")
                .catch((err) => console.warn("[sw] registration failed:", err));
            })
            .catch((err) => {
              console.warn("[sw] manifest fetch failed, retrying SW registration:", err);
              // manifest読み込み失敗時も SW登録を試みる
              navigator.serviceWorker
                .register("/sw.js")
                .catch((err) => console.warn("[sw] registration failed:", err));
            });
        }
      }

      // DOMContentLoadedで即座にService Worker登録を開始
      // (window.load まで待たないことで、より早期にマニフェストとSWをキャッシュできる)
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", ensureManifestLoaded);
      } else {
        ensureManifestLoaded();
      }
    })();
  </script>
</body>
